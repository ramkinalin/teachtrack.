name: teachtrack
description: Offline-first daily management app for school teachers.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.9.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  flutter_riverpod: ^2.5.1

  hive_ce: ^2.7.0
  hive_ce_flutter: ^2.0.0
  path_provider: ^2.1.4

  connectivity_plus: ^6.0.5

  flutter_local_notifications: ^19.0.0
  timezone: ^0.10.0
  flutter_timezone: ^4.0.0

  go_router: ^14.2.7

  intl: ^0.19.0
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
