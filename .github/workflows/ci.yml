name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    name: Analyze, test and build APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Report toolchain versions
        run: flutter --version

      # Generates android/ only when the repo doesn't carry one. Scaffolding into
      # a temp directory and copying just android/ across avoids `flutter create`
      # overwriting lib/main.dart or pubspec.yaml, which it does when run
      # directly inside an existing project.
      #
      # Once android/ is committed this step does nothing, and the manifest
      # becomes an ordinary editable file — which it has to be for notification
      # permissions and the boot receiver.
      - name: Generate the Android platform folder if absent
        run: |
          if [ -d android ]; then
            echo "android/ is committed — using it as-is"
          else
            flutter create --org com.teachtrack --project-name teachtrack /tmp/scaffold
            cp -r /tmp/scaffold/android ./android
            echo "generated_android=true" >> "$GITHUB_ENV"
          fi

      # Offered as a download so the generated folder can be committed once,
      # rather than being regenerated on every run forever.
      #
      # Staged inside a wrapper directory on purpose: uploading `android` alone
      # produces a zip of its *contents*, which is fiddly to put back in the right
      # place. This way the zip contains a ready-to-commit `android/` folder.
      - name: Stage the generated android/ folder for download
        if: env.generated_android == 'true'
        run: |
          mkdir -p android_artifact
          cp -r android android_artifact/android

      - name: Upload the generated android/ folder
        if: env.generated_android == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: android-folder
          path: android_artifact
          include-hidden-files: true
          retention-days: 14

      - name: Install dependencies
        run: flutter pub get

      # continue-on-error so a compile error does not hide the test results:
      # on early runs it is far more useful to see every failure in one pass.
      # The gate step at the end still fails the build.
      - name: Analyze
        id: analyze
        continue-on-error: true
        run: flutter analyze --no-fatal-infos

      - name: Test
        id: test
        continue-on-error: true
        run: flutter test --reporter expanded

      - name: Fail if analyze or tests failed
        if: steps.analyze.outcome == 'failure' || steps.test.outcome == 'failure'
        run: |
          echo "analyze: ${{ steps.analyze.outcome }}"
          echo "test:    ${{ steps.test.outcome }}"
          exit 1

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: teachtrack-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14
